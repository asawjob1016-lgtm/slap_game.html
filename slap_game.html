<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビンタラッシュ</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#87ceeb;
    overflow:hidden;
}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

button{
    padding:15px 30px;
    font-size:20px;
    margin:10px;
}

#gameScreen{
    display:none;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    font-size:24px;
    font-weight:bold;
}

#mistake{
    position:absolute;
    top:45px;
    left:10px;
    font-size:20px;
}

#lane{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:220px;
    height:100%;
}

.character{
    position:absolute;
    width:120px;
    height:120px;
    left:50%;
    transform:translateX(-50%);
    font-size:80px;
    text-align:center;
    user-select:none;
}

#player{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.head{
    font-size:70px;
}

.hand{
    font-size:50px;
}

#message{
    position:absolute;
    top:100px;
    width:100%;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:white;
    text-shadow:2px 2px 5px black;
}
</style>
</head>
<body>

<div id="homeScreen" class="screen">
    <h1>👋 ビンタラッシュ</h1>
    <button onclick="startGame()">スタート</button>
    <button onclick="showHelp()">説明</button>
</div>

<div id="gameScreen">

    <div id="score">Score: 0</div>
    <div id="mistake">Miss: 0 / 3</div>

    <div id="message"></div>

    <div id="lane"></div>

    <div id="player">
        <div class="head">😎</div>
        <div class="hand">🤚 🤚</div>
    </div>

</div>

<script>

const targets = [
    {emoji:"👴", good:true},
    {emoji:"👵", good:true},
    {emoji:"👾", good:true},
    {emoji:"👹", good:true},
    {emoji:"👽", good:true},

    {emoji:"🐶", good:false},
    {emoji:"🐱", good:false},
    {emoji:"🧸", good:false},
    {emoji:"😇", good:false}
];

let score = 0;
let miss = 0;
let speed = 2;

let current = null;
let interval = null;

const lane = document.getElementById("lane");

function showHelp(){
    alert(
`【操作】
右スワイプ → ビンタ
左スワイプ → スルー

【ビンタしてOK】
👴 👵 👾 👹 👽

【守る対象】
🐶 🐱 🧸 😇

守る対象を3回叩くとゲームオーバー！

10点を超えるとスピードアップ！`
    );
}

function startGame(){

    document.getElementById("homeScreen").style.display="none";
    document.getElementById("gameScreen").style.display="block";

    score = 0;
    miss = 0;
    speed = 2;

    updateUI();
    spawnCharacter();

    if(interval) clearInterval(interval);

    interval = setInterval(gameLoop,20);
}

function updateUI(){
    scoreEl.textContent = "Score: " + score;
    mistake.textContent = "Miss: " + miss + " / 3";
}

const scoreEl = document.getElementById("score");
const mistake = document.getElementById("mistake");

function spawnCharacter(){

    lane.innerHTML="";

    const data = targets[Math.floor(Math.random()*targets.length)];

    const div = document.createElement("div");
    div.className="character";
    div.textContent=data.emoji;
    div.style.top="-120px";

    lane.appendChild(div);

    current={
        el:div,
        y:-120,
        good:data.good,
        emoji:data.emoji
    };
}

function gameLoop(){

    if(!current) return;

    current.y += speed;
    current.el.style.top=current.y+"px";

    if(current.y > window.innerHeight-220){

        if(current.good){
            gameOver();
            return;
        }

        spawnCharacter();
    }
}

function gameOver(){

    clearInterval(interval);

    alert("ゲームオーバー\nScore: "+score);

    location.reload();
}

function slap(){

    if(!current) return;

    if(current.good){

        score++;

        if(score > 10){
            speed = 4;
        }

        flash("👋 ビンタ成功！");
    }
    else{

        miss++;

        flash("❌ 守る対象を叩いた");

        if(miss >= 3){
            gameOver();
            return;
        }
    }

    updateUI();
    spawnCharacter();
}

function skip(){

    if(!current) return;

    if(current.good){
        flash("😅 見逃した");
    }else{
        flash("👍 スルー成功");
    }

    spawnCharacter();
}

function flash(text){

    const m=document.getElementById("message");

    m.textContent=text;

    setTimeout(()=>{
        m.textContent="";
    },600);
}

/* スワイプ */

let startX=0;

document.addEventListener("touchstart",(e)=>{
    startX=e.touches[0].clientX;
});

document.addEventListener("touchend",(e)=>{

    let endX=e.changedTouches[0].clientX;
    let diff=endX-startX;

    if(diff>60){
        slap();
    }
    else if(diff<-60){
        skip();
    }
});

</script>

</body>
</html>
